version: "3.8"

services:
  renta-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: rentawallstreet:latest
    container_name: rentawallstreet-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # Montaje de lectura estricta para ingesta de archivos si se requiere pre-cargar CSVs localmente
      - ./data:/app/data:ro
      # Volumen efímero para subidas de usuarios gestionadas por el garbage collector
      - uploads_vol:/app/uploads
    security_opt:
      - no-new-privileges:true
    networks:
      - renta_net

volumes:
  uploads_vol:

networks:
  renta_net:
    driver: bridge

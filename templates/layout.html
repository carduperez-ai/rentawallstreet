<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sovereign Ledger • Auditoría Fiscal{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Public+Sans:wght@700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --aeat-navy: #000a23;
            --aeat-slate: #515f74;
            --aeat-gold: #facc15;
            --bg-body: #f8fafc;
            --font-main: 'Inter', sans-serif;
            --font-public: 'Public Sans', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body { font-family: var(--font-main); background-color: var(--bg-body); color: #1e293b; -webkit-font-smoothing: antialiased; }
        .navbar-ledger { background: var(--aeat-navy); padding: 1rem 0; border-bottom: 3px solid var(--aeat-gold); }
        .nav-link-ledger { color: rgba(255,255,255,0.7); font-weight: 600; font-size: 0.9rem; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; transition: all 0.2s; }
        .nav-link-ledger:hover, .nav-link-ledger.active { color: white; background: rgba(255,255,255,0.1); }
        .casilla-badge { background: #f1f5f9; color: var(--aeat-slate); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.4rem; border-radius: 4px; border: 1px solid #e2e8f0; margin-left: 0.5rem; }
        .font-public { font-family: var(--font-public); }
        .font-mono { font-family: var(--font-mono); }
        /* Hide number input arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar removed as per user request -->


    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".git", "__pycache__", "venv", ".env"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
exclude = [
    "legacy-python/",
    "tests/",
    "juridico/"
]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
